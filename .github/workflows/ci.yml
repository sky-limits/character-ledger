name: Character Ledger CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check core.js
          node --check app.js
      - name: Run tracker tests
        run: |
          node tests/core.test.js
          node tests/app.test.js
          node tests/journal.test.js
          node tests/release.test.js
